version: 1
active_profile: safe-default

profiles:
  safe-default:
    description: Complete repository-policy exports; no MCP or executable-skill policy.
    # Cursor applies .cursor/rules/, AGENTS.md, and CLAUDE.md together. Its
    # adapter is therefore a short pointer, not a copy -- see render_cursor.
    # It stays opt-in because AGENTS.md alone already reaches Cursor; add the
    # cursor target when you want the rule stated explicitly as well.
    default_targets: [agents, claude]
    allowed_targets: [agents, claude, cursor]
    allow_community_skill_scripts: false
