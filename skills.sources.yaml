# skills.sources.yaml — curated upstream skill sources for agent_bootstrap
# Install template (every entry):
#   npx skills add <repo> --skill <name> ... \
#     -a cursor -a codex -a claude-code -a github-copilot -g -y
#
# Lockfile: skills-lock.json is a stub until the first successful
# `./install.sh skills install` (or `npx skills` run). Commit the regenerated
# lockfile after install — do not hand-edit pins.

version: 1
agents:
  - cursor
  - codex
  - claude-code
  - github-copilot
scope: global

sources:
  - id: superpowers
    repo: obra/superpowers
    skills:
      - brainstorming
      - writing-plans
      - executing-plans
      - subagent-driven-development
      - test-driven-development

  - id: devops-fullstack
    # NOTE: upstream org slug is literally "full-statck-skills" (misspelled on GitHub).
    # Verified: https://github.com/full-statck-skills/devops-skills — part of partme-ai/full-stack-skills ecosystem.
    repo: full-statck-skills/devops-skills
    skills:
      - kubernetes
      - terraform
      - github-actions
      - gitlab-ci

  - id: devops-anmol
    repo: anmolnagpal/devops-skills
    skills:
      - k8s
      - github-actions
      - owasp

  - id: claude-devops
    repo: jeffallan/claude-skills
    skills:
      - kubernetes-specialist
      - devops-engineer

  - id: research-papers
    repo: ShaishavMaisuria/research-paper-lifecycle-skills
    skills:
      - literature-review

  # TODO: add Akindu23/my-agent-skills source when skill folder names are verified
  # (council, grilling, recursive-decomposition, yagni, document, find-skills, etc.)

  - id: graphify
    repo: safishamsi/graphify
    skills:
      - graphify
    enabled: false  # not advertised in base templates; upstream has no Agent Skills SKILL.md layout yet

  - id: obsidian-memory
    repo: AdamTylerLynch/obsidian-agent-memory-skills
    skills: []
    enabled: false  # not advertised in base templates
