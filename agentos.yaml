# agentos.yaml — v4 Lite config for agent_bootstrap
# File name borrows AgentOS v4; repo identity stays agent_bootstrap (decision #1).

version: 1

bootstrap_home:
  # install.sh exports this from the clone location — never hardcode user paths.
  # Dotfiles agents_menu (Stage 3) should clone here and run ./install.sh.
  env_var: AGENT_BOOTSTRAP_HOME
  derive_from: repo_root

active_profile: safe-default

profiles:
  safe-default:
    description: >-
      Conservative defaults — curated upstream skills, read-first MCP,
      instruction-only assets unless explicitly enabled in catalog.
    trust_level: community-reviewed
    skills:
      scope: global
      allow_executable_scripts: false

export_targets:
  codex:
    description: Codex CLI / IDE global instructions
    outputs:
      - path: "{codex_home}/AGENTS.md"
        source: global/AGENTS.md

  claude:
    description: Claude Code global instructions
    outputs:
      - path: "{claude_home}/CLAUDE.md"
        source: global/AGENTS.md
      - path: "{claude_home}/AGENTS.md"
        source: global/AGENTS.md

  cursor:
    description: Cursor global MCP + workspace skill rules
    outputs:
      - path: "{cursor_home}/mcp.json"
        source: mcp/mcp.json
      - path: "{workspace}/.cursor/rules/bootstrap-skills.mdc"
        generated: true

  github-copilot:
    description: GitHub Copilot workspace instructions
    outputs:
      - path: "{workspace}/.github/copilot-instructions.md"
        source: global/AGENTS.md

  repo:
    description: Per-repo compatibility surfaces (canonical overlay + global baseline)
    outputs:
      - path: "{workspace}/CLAUDE.md"
        source: merged
      - path: "{workspace}/.github/copilot-instructions.md"
        source: merged
