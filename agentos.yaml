version: 1
active_profile: safe-default

profiles:
  safe-default:
    description: Complete repository-policy exports; no MCP or executable-skill policy.
    # Cursor reads AGENTS.md natively and has no import syntax, so a cursor
    # adapter is a second full copy of the same policy in context. It stays
    # available in allowed_targets for repos that opt in explicitly.
    default_targets: [agents, claude]
    allowed_targets: [agents, claude, cursor]
    allow_community_skill_scripts: false
